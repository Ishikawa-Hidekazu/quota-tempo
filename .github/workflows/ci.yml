name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Swift format
        run: xcrun swift-format lint --strict --recursive Sources Tests
      - name: Test
        run: bash scripts/test-swift.sh
      - name: Desktop connection stays isolated to the app
        run: node scripts/test-desktop-candidate-isolation.mjs
      - name: Swift test runner regression checks
        run: node scripts/test-swift-runner.mjs
      - name: Mods metadata experiment (synthetic only)
        run: node --test experiments/claude-mods-usage/producer.test.mjs experiments/claude-mods-usage/probe.test.mjs experiments/claude-mods-usage/observe.test.mjs experiments/claude-mods-usage/tests/official-ipc-client.test.mjs
      - name: Code comparison packaging and project-local lifecycle (synthetic only)
        run: node --test scripts/package-code-comparison-plugin.test.mjs scripts/manage-code-comparison-plugin.test.mjs
      - name: Code preview builder and compiled-artifact isolation regressions
        run: |
          node scripts/test-code-comparison-preview-builder.mjs
          node scripts/test-desktop-artifact-isolation.mjs
      - name: Pinned Code transport bundle reproducibility
        working-directory: experiments/claude-mods-usage/crypto-build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.mjs --check
      - name: Local Desktop preview packaging (synthetic only)
        run: node scripts/test-desktop-integration-builder.mjs
      - name: Local Desktop startup harness (synthetic only)
        run: node scripts/test-desktop-integration-startup-tests.mjs
      - name: Local Desktop integration tests (synthetic only)
        run: QUOTATEMPO_DESKTOP_INTEGRATION_PREVIEW=1 bash scripts/test-swift.sh
      - name: Code-only preview signed resources (local ad-hoc, no live acquisition)
        run: |
          temporary="$(mktemp -d /private/tmp/qtc-code-preview-ci.XXXXXX)"
          trap 'rm -rf -- "$temporary"' EXIT
          bash scripts/build-code-comparison-preview.sh "$temporary/CodeComparison.app"
          node scripts/test-code-comparison-signed-package.mjs --app "$temporary/CodeComparison.app"
      - name: Browser bridge fixtures (no browser or provider access)
        run: |
          node --test BrowserExtension/tests/*.test.cjs
          node scripts/test-browser-bridge-installer.mjs
          swift build --product QuotaTempoBrowserHost
          node scripts/test-browser-host.mjs
      - name: Release build
        run: swift build -c release
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: ShellCheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck scripts/*.sh
      - name: Homebrew Cask style
        run: brew style Casks/*.rb
      - name: Release policy
        run: |
          ./scripts/test-version-consistency.sh
          ./scripts/test-release-policy.sh
          ./scripts/test-distribution-policy.sh
          ./scripts/test-package-reproducibility.sh
      - name: Deterministic bundle
        run: ./scripts/test-app-bundle.sh --skip-launch
      - name: Diff safety
        run: git diff --check
