name: Feature request
description: Suggest a focused improvement to QuotaTempo.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What weekly-planning problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Privacy or provider impact
      description: Note any local data, provider process, login, or network implications.
