name: Bug report
description: Report a reproducible QuotaTempo problem without sharing private provider data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, cookies, provider files, raw responses, prompts, transcripts, private paths, or personal quota values.
  - type: input
    id: version
    attributes:
      label: QuotaTempo version
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.6, Apple M2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the visible result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open QuotaTempo
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Support-safe diagnostics
      description: Optional. Paste only the output from QuotaTempo's Copy diagnostics action.
      render: text
