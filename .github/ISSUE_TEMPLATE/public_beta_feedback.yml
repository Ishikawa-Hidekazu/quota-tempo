name: Public Beta feedback
description: Share a privacy-safe first-run result for QuotaTempo Public Beta.
title: "[Beta feedback]: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing QuotaTempo Public Beta.

        **Do not include quota percentages, reset dates or times, credentials, tokens, cookies, prompts, transcripts, provider files, raw responses, private paths, or screenshots containing private data.**
  - type: input
    id: version
    attributes:
      label: QuotaTempo version
      placeholder: 0.1.2
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Mac setup
      description: Choose the closest non-identifying setup.
      options:
        - Apple silicon, macOS 14
        - Apple silicon, macOS 15
        - Apple silicon, macOS 26 or later
        - Other supported Apple silicon setup
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Providers enabled
      options:
        - Codex only
        - Claude only
        - Codex and Claude
    validations:
      required: true
  - type: dropdown
    id: first_run
    attributes:
      label: First-run result
      options:
        - Reached the weekly view
        - Reached the weekly view with an availability message
        - Stopped during installation
        - Stopped during first launch
        - Stopped during provider setup
        - The result was unclear
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What was clear or unclear?
      description: Describe only the visible workflow. Keep personal usage values and local details out of the report.
      placeholder: I expected ... and saw ...
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed quota percentages, reset dates or times, credentials, prompts, transcripts, provider files, raw responses, private paths, and other private data.
          required: true
