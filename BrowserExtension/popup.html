<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuotaTempo bridge</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>QuotaTempo</h1>
    <p id="version">Bridge 0.1.3</p>
    <p id="status" role="status" aria-live="polite">Loading</p>
    <p id="detail"></p>
    <div class="actions">
      <button id="connect" type="button">Connect</button>
      <button id="reconnect" type="button" hidden>Reconnect</button>
      <button id="disconnect" type="button" hidden>Disconnect</button>
    </div>
  </main>
</body>
</html>
